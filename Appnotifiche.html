<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F2EDE1;
    --surface: #FFFFFF;
    --surface-2: #E8E0CC;
    --ink: #211C15;
    --muted: #6C6152;
    --wine: #4E1524;
    --wine-dark: #35101B;
    --olive: #96772A;
    --olive-dark: #7A5F1F;
    --amber: #B08628;
    --line: #DDD3BC;
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --shadow: 0 1px 3px rgba(33,28,21,0.07), 0 2px 8px rgba(33,28,21,0.05);
    --shadow-lift: 0 12px 32px rgba(33,28,21,0.18);
    --gold: #B08628;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .brand{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  #app{ display:flex; flex-direction:column; height:100%; min-height:100vh; }

  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:var(--wine);
    color:#F1E6D0;
    position:sticky; top:0; z-index:20;
    box-shadow: var(--shadow);
    border-bottom:2px solid var(--gold);
  }
  header .brand-group{ display:flex; align-items:center; gap:10px; min-width:0; }
  header .logo-badge{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    background:#F1E6D0; color:var(--wine);
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:14px; letter-spacing:0.5px;
    overflow:hidden; border:1.5px solid var(--gold);
  }
  .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  header .title{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  header .title .name{ font-family: Georgia, serif; font-size:17px; letter-spacing:0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .title .sub{ font-size:11px; color:#D8C3AE; margin-top:2px; }
  header .actions{ display:flex; gap:6px; flex:0 0 auto; }
  .edit-banner{
    background:var(--amber); color:#2E2010; font-size:12.5px; text-align:center;
    padding:8px 14px; line-height:1.4;
  }
  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:none; color:#F1E6D0; width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.24); }
  .icon-btn.on{ background:#F1E6D0; color:var(--wine); }

  /* SYNC PILL */
  .sync-pill{
    font-size:10px; color:#D8C3AE; display:flex; align-items:center; gap:5px; margin-top:2px;
  }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:#7FA35C; }

  /* FLOOR */
  main{ flex:1; padding:16px; padding-bottom:90px; max-width:720px; width:100%; margin:0 auto; }
  .floor-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap:14px;
  }
  .table-card{
    aspect-ratio: 1 / 1;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius-l);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    cursor:pointer;
    position:relative;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: var(--shadow);
  }
  .table-card:active{ transform: scale(0.96); }
  .table-card.round{ border-radius:50%; }
  .table-card .t-name{ font-weight:600; font-size:15px; text-align:center; padding:0 8px; }
  .table-card .t-seats{ font-size:11px; color:var(--muted); }
  .table-card .t-status{
    position:absolute; top:10px; right:10px;
    width:10px; height:10px; border-radius:50%;
    background:#C4BBA4;
  }
  .table-card.status-libero{ border-color:var(--line); }
  .table-card.status-libero .t-status{ background:#A9B48C; }
  .table-card.status-comanda{ border-color:var(--amber); background:#F7EEDA; }
  .table-card.status-comanda .t-status{ background:var(--amber); }
  .table-card .t-total{ font-size:12px; color:var(--wine); font-weight:600; }
  .table-card .t-edit-badge{
    position:absolute; bottom:8px; right:8px; font-size:11px; color:var(--muted);
  }

  .add-table-card{
    aspect-ratio:1/1;
    border:2px dashed var(--line);
    border-radius:var(--radius-l);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:28px; cursor:pointer; background:transparent;
  }
  .add-table-card:active{ background:var(--surface-2); }

  .empty-hint{ text-align:center; color:var(--muted); font-size:13px; margin-top:40px; line-height:1.5; }

  /* OVERLAYS */
  .overlay{
    position:fixed; inset:0; background:rgba(33,28,21,0.45);
    z-index:40; display:flex; justify-content:flex-end;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .panel{
    background:var(--bg);
    width:100%; max-width:480px; height:100%;
    display:flex; flex-direction:column;
    transform: translateX(24px);
    transition: transform .18s ease;
    box-shadow: var(--shadow-lift);
  }
  .overlay.open .panel{ transform: translateX(0); }
  .panel-header{
    background:var(--wine); color:#F1E6D0; padding:14px 16px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:2;
  }
  .panel-header input.name-edit{
    background:transparent; border:none; border-bottom:1px solid rgba(241,230,208,0.4);
    color:#F1E6D0; font-family:Georgia,serif; font-size:19px; padding:2px 0; flex:1; min-width:0;
  }
  .panel-header input.name-edit:focus{ outline:none; border-bottom-color:#F1E6D0; }
  .panel-body{ flex:1; overflow-y:auto; padding:14px 16px 100px; }
  .panel-close{ margin-left:auto; }

  .section-label{ font-size:12px; text-transform:none; color:var(--muted); font-weight:600; margin:18px 0 8px; }
  .section-label:first-child{ margin-top:0; }

  .order-line{
    background:var(--surface); border-radius:var(--radius-m); padding:10px 12px;
    margin-bottom:8px; box-shadow:var(--shadow);
  }
  .order-line.selected{ background:#ECE0C4; box-shadow:0 0 0 1.5px var(--wine); }
  .line-check{ width:20px; height:20px; flex:0 0 auto; }
  .order-line .line-row{ display:flex; align-items:center; gap:10px; }
  .order-line .li-info{ flex:1; min-width:0; }
  .order-line .li-name{ font-weight:600; font-size:14px; }
  .order-line .li-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .note-input{
    width:100%; margin-top:8px; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:12.5px; background:var(--bg); color:var(--ink);
  }
  .note-input::placeholder{ color:#A79C82; }
  .qty-ctrl{ display:flex; align-items:center; gap:6px; }
  .qty-ctrl button{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
    font-size:15px; cursor:pointer; color:var(--ink);
  }
  .qty-ctrl span{ min-width:18px; text-align:center; font-weight:600; font-size:14px; }
  .weight-input{
    width:58px; border:1px solid var(--line); border-radius:8px; padding:4px 6px; font-size:13px; text-align:right;
  }
  .remove-line{ background:none; border:none; color:#8C3524; font-size:18px; cursor:pointer; padding:4px; }

  .total-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface-2); border-radius:var(--radius-m); padding:12px 14px; margin-top:6px;
    font-weight:700; font-size:15px;
  }
  .total-bar .lbl{ font-weight:500; font-size:13px; color:var(--muted); }

  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; flex-wrap:wrap; }
  .cat-tab{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:13px; cursor:pointer; color:var(--ink); white-space:nowrap;
  }
  .cat-tab.active{ background:var(--olive); border-color:var(--olive); color:#fff; }
  .conto-tab.active{ background:var(--wine); border-color:var(--wine); }
  .conto-del{ margin-left:6px; opacity:0.75; }
  .conto-add{ border-style:dashed; color:var(--olive-dark); background:transparent; }

  .menu-item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .menu-item-row:last-child{ border-bottom:none; }
  .menu-item-row .mi-name{ font-size:14px; font-weight:500; }
  .menu-item-row .mi-price{ font-size:13px; color:var(--muted); }
  .menu-item-row .mi-tag{ font-size:10px; color:var(--olive-dark); }

  .guide-item{ padding:12px 4px; border-bottom:1px solid var(--line); }
  .guide-item:last-child{ border-bottom:none; }
  .guide-name{ font-weight:700; font-size:14px; }
  .guide-desc{ font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:var(--radius-m); border:none; font-size:14px; font-weight:600;
    cursor:pointer;
  }
  .btn-primary{ background:var(--wine); color:#F1E6D0; }
  .btn-primary:active{ background:var(--wine-dark); }
  .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-outline:active{ background:var(--surface-2); }
  .btn-danger{ background:#8C3524; color:#fff; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:none; color:var(--wine); border:none; font-weight:600; font-size:13px; padding:6px 2px; cursor:pointer; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-m);
    font-size:14px; background:var(--surface); color:var(--ink);
  }
  .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-m);
    font-size:14px; background:var(--surface); color:var(--ink); font-family:inherit; resize:vertical;
  }
  .row2{ display:flex; gap:10px; }
  .row2 > .field{ flex:1; }
  .checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-field input{ width:18px; height:18px; }
  .checkbox-field label{ font-size:13px; color:var(--ink); font-weight:500; }

  .shape-picker{ display:flex; gap:10px; }
  .shape-opt{
    flex:1; padding:14px; border:2px solid var(--line); border-radius:var(--radius-m);
    text-align:center; cursor:pointer; font-size:13px; color:var(--muted);
  }
  .shape-opt.selected{ border-color:var(--wine); color:var(--wine); background:#F1E3E0; font-weight:600; }

  .cat-block{ margin-bottom:22px; }
  .cat-block-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .cat-block-head .cname{ font-weight:700; font-size:15px; }
  .cat-block-body{ background:var(--surface); border-radius:var(--radius-m); box-shadow:var(--shadow); padding:2px 12px; }
  .link-danger{ color:#8C3524; font-size:12px; cursor:pointer; background:none; border:none; }

  .modal-mini{
    position:fixed; inset:0; background:rgba(33,28,21,0.5); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-mini .sheet{
    background:var(--bg); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:18px 16px 22px; max-height:88vh; overflow-y:auto;
  }
  .modal-mini h3{ margin:0 0 14px; font-family:Georgia,serif; font-size:19px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:16px; }
  .sheet-actions .btn{ flex:1; }

  .fab-add{
    position:fixed; right:20px; bottom:20px; z-index:15;
    width:56px; height:56px; border-radius:50%; background:var(--olive); color:#fff;
    border:none; font-size:26px; box-shadow:var(--shadow-lift); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-add:active{ background:var(--olive-dark); }

  @media (min-width:600px){
    .overlay{ background:rgba(33,28,21,0.35); }
  }

  /* BAR MODE */
  .bar-audio-banner{
    background:var(--gold); color:#2E2010; text-align:center; font-weight:700;
    padding:12px 16px; cursor:pointer; font-size:14px;
  }
  .bar-table-group{ margin-bottom:26px; }
  .bar-table-name{ font-family:Georgia,serif; font-size:19px; color:var(--wine); margin-bottom:10px; }
  .bar-cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .bar-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-l);
    padding:16px; box-shadow:var(--shadow); transition: background .3s ease, box-shadow .3s ease;
  }
  .bar-card-main{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .bar-card-qty{ font-family:Georgia,serif; font-size:22px; color:var(--wine); font-weight:700; }
  .bar-card-name{ font-size:17px; font-weight:600; }
  .bar-card-note{ font-size:13px; color:var(--muted); margin-bottom:10px; font-style:italic; }
  .bar-done-btn{ margin-top:4px; }
  .bar-card.bar-flash{
    background:var(--tint-open, #F7EEDA);
    box-shadow: 0 0 0 3px var(--gold), var(--shadow-lift);
    animation: bar-pulse 1s ease-in-out infinite;
  }
  @keyframes bar-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
  }
</style>
</head>

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  function beep(){
    if(!audioCtx) return;
    try{
      const t0 = audioCtx.currentTime;
      [ [880, t0], [1046, t0+0.22] ].forEach(([freq, t])=>{
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t+0.36);
      });
    }catch(e){}
    if(navigator.vibrate) try{ navigator.vibrate([180,80,180]); }catch(e){}

  function computeCocktailUpdates(lines){

  function allLines(tableId){
    const raw = state.orders[tableId];
    if(!raw || !Array.isArray(raw) || raw.length===0) return [];
    if(raw[0] && raw[0].lines) return raw.flatMap(c => c.lines || []);
    return raw; // vecchio formato flat
  }
  function tableTotal(tableId){

  function lineTotal(l){
    if(l.weight!=null) return (l.price * (l.weight/100)) * l.qty;
    return l.price * l.qty;
  }
  function tableStatus(tableId){
    return allLines(tableId).length > 0 ? 'comanda' : 'libero';

  function contoTotal(conto){
    return (conto.lines||[]).reduce((sum, l) => sum + lineTotal(l), 0);

  // Lettura CON migrazione/creazione, usata solo quando si apre/modifica un tavolo.
  function getConti(tableId){
    let raw = state.orders[tableId];
    if(!raw || !Array.isArray(raw) || raw.length===0){
      raw = [{id: uid(), name:'Conto 1', lines: []}];
      state.orders[tableId] = raw;
    } else if(raw[0] && !raw[0].lines){

      state.orders[tableId] = raw;
    }
    return state.orders[tableId];
  }
  function findLine(tableId, lineId){

    for(const c of conti){

    }
    return null;
  }

  function barView(){
    const allNow = allCocktailLines();
    const anyNew = computeCocktailUpdates(allNow);
    const lines = allNow.filter(l => !barDismissed[l.id]);
    if(anyNew){
      beep();
      setTimeout(()=>{ barHighlight = {}; render(); }, 7000);
    }
    const byTable = {};
    lines.forEach(l=>{
      if(!byTable[l.tableId]) byTable[l.tableId] = {tableName: l.tableName, lines: []};
      byTable[l.tableId].lines.push(l);
    });
    const groups = Object.values(byTable);

    const audioBanner = !audioUnlocked ? `
      <div class="bar-audio-banner" onclick="App.barUnlockAudio()">🔊 Tocca qui per attivare l'audio delle notifiche</div>
    ` : '';
    const pushBanner = !pushSubscribed ? `

    ` : `
      <div class="bar-audio-banner" style="background:var(--surface-2); color:var(--muted); cursor:default;">🔔 Notifiche push attive su questo dispositivo</div>
    `;

    const body = groups.length ? groups.map(g => `
      <div class="bar-table-group">
        <div class="bar-table-name">${escapeHtml(g.tableName)}</div>
        <div class="bar-cards">

            <div class="bar-card ${barHighlight[l.id] ? 'bar-flash' : ''}">
              <div class="bar-card-main">

          `).join('')}

    return `

        <div class="brand-group">
          <div class="logo-badge" id="logo-slot"><img src="${LOGO_DATAURL}" alt="logo"></div>
          <div class="title">
            <div class="name brand">Ordini Cocktail</div>

  /* ---------- actions ---------- */
  const App = {
    toggleEdit(){ ui.editMode = !ui.editMode; render(); },

    openTable(id){
      ui.openTableId = id; ui.activeCat = null;
      ui.selectMode = false; ui.selectedLines = {};
      const conti = getConti(id);
      ui.activeContoId = conti[0].id;
      render();
    },
    closeTable(){ ui.openTableId = null; render(); },
    renameTable(id, val){
      const t = state.tables.find(x=>x.id===id); if(!t) return;
      t.name = val.trim() || t.name;
      persist('tables'); render();
    },
    setActiveCat(id){ ui.activeCat = id; render(); },

    setActiveConto(id){ ui.activeContoId = id; ui.selectMode = false; ui.selectedLines = {}; render(); },

    toggleSelectMode(){ ui.selectMode = !ui.selectMode; ui.selectedLines = {}; render(); },
    toggleLineSelected(lineId){
      if(ui.selectedLines[lineId]) delete ui.selectedLines[lineId];
      else ui.selectedLines[lineId] = true;
      render();
    },
    makeSeparateBill(){
      const tid = ui.openTableId;
      const conti = getConti(tid);
      const conto = conti.find(c=>c.id===ui.activeContoId) || conti[0];
      const selectedIds = Object.keys(ui.selectedLines);
      if(selectedIds.length===0){ alert('Seleziona almeno un elemento da mettere in conto.'); return; }
      const chosen = conto.lines.filter(l=>selectedIds.includes(l.id));
      const total = chosen.reduce((s,l)=>s+lineTotal(l), 0);
      if(!confirm(`Confermi il conto separato di ${chosen.length} elementi per un totale di ${eur(total)}?\nVerranno tolti dal tavolo e registrati nel Log.`)) return;
      const t = state.tables.find(x=>x.id===tid);
      const entry = {
        id: uid(),
        timestamp: new Date().toISOString(),
        tableId: tid,
        tableName: t ? t.name : '—',
        contoName: conto.name,
        items: chosen.map(l => ({ name:l.name, qty:l.qty, weight:l.weight, price:l.price, note:l.note||'', total: lineTotal(l) })),
        total,
      };
      state.log = state.log || [];
      state.log.unshift(entry);
      conto.lines = conto.lines.filter(l=>!selectedIds.includes(l.id));
      ui.selectMode = false; ui.selectedLines = {};
      persist('orders'); persist('log'); render();
    },
    addConto(){
      const conti = getConti(ui.openTableId);
      if(conti.length >= 6){ alert('Massimo 6 conti per tavolo.'); return; }
      const nc = {id: uid(), name: 'Conto '+(conti.length+1), lines: []};
      conti.push(nc);
      ui.activeContoId = nc.id;
      persist('orders'); render();
    },
    deleteConto(id){
      const conti = getConti(ui.openTableId);
      if(conti.length <= 1){ alert('Deve rimanere almeno un conto.'); return; }
      if(!confirm('Eliminare questo conto e i suoi elementi?')) return;
      state.orders[ui.openTableId] = conti.filter(c=>c.id!==id);
      if(ui.activeContoId===id) ui.activeContoId = state.orders[ui.openTableId][0].id;
      persist('orders'); render();
    },

    addLine(catId, itemId){
      const cat = state.menu.find(c=>c.id===catId); const it = cat.items.find(i=>i.id===itemId);
      const tid = ui.openTableId;
      const conti = getConti(tid);
      const conto = conti.find(c=>c.id===ui.activeContoId) || conti[0];
      const existing = !it.weight ? conto.lines.find(l=>l.itemId===itemId) : null;
      if(existing){ existing.qty += 1; }
      else{
        conto.lines.push({
          id: uid(), itemId: it.id, name: it.name, categoryName: cat.name,
          price: it.price, qty: 1, weight: it.weight ? 100 : null, note: '',
          cocktail: !!it.cocktail, createdAt: new Date().toISOString()
        });
      }
      persist('orders'); render();
    },
    changeQty(lineId, delta){
      const tid = ui.openTableId; const loc = findLine(tid, lineId); if(!loc) return;
      loc.line.qty += delta;
      if(loc.line.qty <= 0){ loc.conto.lines = loc.conto.lines.filter(x=>x.id!==lineId); }
      persist('orders'); render();
    },
    setWeight(lineId, val){
      const tid = ui.openTableId; const loc = findLine(tid, lineId); if(!loc) return;
      loc.line.weight = Math.max(0, parseFloat(val)||0);
      persist('orders'); render();
    },
    setNote(lineId, val){
      const tid = ui.openTableId; const loc = findLine(tid, lineId); if(!loc) return;
      loc.line.note = val;
      persist('orders');
    },
    removeLine(lineId){
      const tid = ui.openTableId; const loc = findLine(tid, lineId); if(!loc) return;
      loc.conto.lines = loc.conto.lines.filter(x=>x.id!==lineId);
      persist('orders'); render();
    },

    openMenuManager(){ ui.menuManagerOpen = true; render(); },
    closeMenuManager(){ ui.menuManagerOpen = false; render(); },

    openGuida(){ ui.guidaOpen = true; render(); },
    closeGuida(){ ui.guidaOpen = false; render(); },
    setGuidaTab(tab){ ui.guidaTab = tab; render(); },
    openAddGuide(tab){ ui.modal = {type:'add-guide', tab}; render(); },
    openEditGuide(tab, id){ ui.modal = {type:'edit-guide', tab, id}; render(); },
    saveGuide(tab, id){
      const name = document.getElementById('m-gname').value.trim();
      const desc = document.getElementById('m-gdesc').value.trim();
      if(!name) return;
      if(!state.guida) state.guida = {taglieri:[], cocktail:[]};
      if(!state.guida[tab]) state.guida[tab] = [];
      if(id){
        const it = state.guida[tab].find(x=>x.id===id);
        it.name = name; it.desc = desc;
      } else {
        state.guida[tab].push({id: uid(), name, desc});
      }
      persist('guida'); ui.modal = null; render();
    },
    deleteGuide(tab, id){
      if(!confirm('Eliminare questa voce dalla guida?')) return;
      state.guida[tab] = (state.guida[tab]||[]).filter(x=>x.id!==id);
      persist('guida'); ui.modal = null; render();
    },

    openLog(){ ui.logOpen = true; render(); },
    closeLog(){ ui.logOpen = false; render(); },
    barUnlockAudio(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
        audioUnlocked = true;
        beep();
      }catch(e){ audioUnlocked = true; }
      render();
    },
    barToggleDone(lineId){
      barDismissed[lineId] = true;
      render();
    },
    enablePush(){ enablePushNotifications(); },
    resetNight(){
      if(!confirm('Sei sicuro di voler resettare la serata?\n\nI tavoli torneranno a essere 4 di default ("Tavolo 1"-"Tavolo 4") e tutte le comande verranno azzerate.\nIl Log storico resterà comunque salvato.')) return;
      state.tables = defaultTables();
      state.orders = {};
      persist('tables');
      persist('orders');
      ui.logOpen = false;
      render();
    },

    openAddTable(){ ui.modal = {type:'add-table', shape:'round'}; render(); },
    openEditTable(id){ const t = state.tables.find(x=>x.id===id); ui.modal = {type:'edit-table', id, shape:t.shape}; render(); },
    pickShape(shape){ ui.modal.shape = shape; render(); document.getElementById('m-name')?.focus(); },
    saveTable(id){
      const name = document.getElementById('m-name').value.trim() || (id ? state.tables.find(t=>t.id===id).name : 'Nuovo tavolo');
      const seats = Math.max(1, parseInt(document.getElementById('m-seats').value)||4);
      const shape = ui.modal.shape;
      if(id){
        const t = state.tables.find(x=>x.id===id);
        t.name = name; t.seats = seats; t.shape = shape;
      } else {
        if(state.tables.length >= 10){ alert('Massimo 10 tavoli.'); return; }
        state.tables.push({id: uid(), name, seats, shape});
      }
      persist('tables'); ui.modal = null; render();
    },
    deleteTable(id){
      if(!confirm('Eliminare questo tavolo e la sua comanda?')) return;
      state.tables = state.tables.filter(t=>t.id!==id);
      delete state.orders[id];
      persist('tables'); persist('orders');
      ui.modal = null; render();
    },

    openAddCategory(){ ui.modal = {type:'add-category'}; render(); },
    saveCategory(){
      const name = document.getElementById('m-catname').value.trim();
      if(!name) return;
      state.menu.push({id: uid(), name, items: []});
      persist('menu'); ui.modal = null; render();
    },
    deleteCategory(id){
      if(!confirm('Eliminare questa categoria e tutti i suoi elementi?')) return;
      state.menu = state.menu.filter(c=>c.id!==id);
      persist('menu'); render();
    },

    openAddItem(catId){ ui.modal = {type:'add-item', catId}; render(); },
    openEditItem(catId, itemId){ ui.modal = {type:'edit-item', catId, itemId}; render(); },
    toggleWeightLabel(){
      const on = document.getElementById('m-iweight').checked;
      document.getElementById('m-iprice-label').textContent = on ? 'Prezzo al etto (100g)' : 'Prezzo';
    },
    saveItem(catId, itemId){
      const name = document.getElementById('m-iname').value.trim();
      const price = parseFloat(document.getElementById('m-iprice').value) || 0;
      const weight = document.getElementById('m-iweight').checked;
      const cocktail = document.getElementById('m-icocktail').checked;
      if(!name) return;
      const cat = state.menu.find(c=>c.id===catId);
      if(itemId){
        const it = cat.items.find(i=>i.id===itemId);
        it.name = name; it.price = price; it.weight = weight; it.cocktail = cocktail;
      } else {
        cat.items.push({id: uid(), name, price, weight, cocktail});
      }
      persist('menu'); ui.modal = null; render();
    },
    deleteItem(catId, itemId){
      const cat = state.menu.find(c=>c.id===catId);
      cat.items = cat.items.filter(i=>i.id!==itemId);
      persist('menu'); ui.modal = null; render();
    },

    closeModal(){ ui.modal = null; render(); },

    cancelExit(){ ui.exitConfirmOpen = false; render(); },
    confirmExit(){
      ui.exitConfirmOpen = false;
      exiting = true;
      render();
      history.back();
    },
  };
  window.App = App;

  /* ---------- doppio "indietro" per uscire ---------- */
  let exiting = false;
  try{
    history.pushState({guard:true}, '', location.href);
    window.addEventListener('popstate', function(){
      if(exiting) return;
      history.pushState({guard:true}, '', location.href);
      ui.exitConfirmOpen = true;
      render();
    });
  }catch(e){ /* history API non disponibile: nessun blocco, il back funziona normalmente */ }

  loadAll();
})();
</script>
</body>
</html>
