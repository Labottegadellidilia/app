  .bg-overlay{ position:fixed; inset:0; z-index:-1; background: rgba(20,42,31,0.35); }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    background: rgba(20,26,18,0.55);
    backdrop-filter: blur(6px);
    color: var(--cream);
    position:sticky; top:0; z-index:20;
    border-bottom: 2px solid var(--gold);
  }
  header .name{ font-size:20px; font-weight:800; letter-spacing:0.3px; }
  header .sub{ font-size:11.5px; color:var(--gold); margin-top:2px; font-weight:600; }
  .sync-pill{ font-size:10px; color:#D8CBAE; display:flex; align-items:center; gap:5px; margin-top:2px; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:#7FA35C; }
  .icon-btn{
    background:rgba(255,255,255,0.14); border:none; color:var(--cream);
    width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.28); }

  main{ flex:1; padding:18px; max-width:760px; width:100%; margin:0 auto; }

  .panel{
    background: rgba(251,244,226,0.96);
    border-radius:20px; padding:18px; box-shadow: var(--shadow-lift);
  }

  /* CASSA: griglia pulsanti */
  .item-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:14px; }
  .item-btn{
    aspect-ratio: 1/0.85; border:none; border-radius:16px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:#fff; font-weight:800; font-size:16px; text-align:center; padding:10px;
    box-shadow: var(--shadow); position:relative; transition: transform .1s ease;
  }
  .item-btn:active{ transform: scale(0.95); }
  .item-btn .pending-badge{
    position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.35);
    border-radius:999px; padding:2px 9px; font-size:12px; font-weight:700;
  }
  .add-item-btn{
    aspect-ratio:1/0.85; border:2px dashed var(--line); border-radius:16px; background:transparent;
    color:var(--gold-dark); font-size:30px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background: var(--green); color:var(--cream); padding:14px 22px; border-radius:14px;
    font-weight:700; font-size:15px; box-shadow:var(--shadow-lift); z-index:80;
    display:flex; align-items:center; gap:10px;
    animation: toast-in .18s ease;
  }
  @keyframes toast-in{ from{ opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
  .toast .dot{ width:14px; height:14px; border-radius:50%; }

  /* CUCINA */
  .now-banner{
    background: var(--green); color:#fff; border-radius:16px; padding:16px 18px;
    display:flex; align-items:center; gap:16px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .now-banner .num{ font-size:44px; line-height:1; }
  .now-banner .swatch{ width:16px; height:52px; border-radius:6px; flex:0 0 auto; }
  .now-banner .info{ flex:1; min-width:0; }
  .now-banner .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); font-weight:700; }
  .now-banner .iname{ font-size:16px; font-weight:700; margin-top:2px; }

  .queue-list{ display:flex; flex-direction:column; gap:10px; }
  .queue-row{
    display:flex; align-items:center; gap:14px; background:#fff; border-radius:14px;
    padding:12px 14px; box-shadow:var(--shadow); cursor:pointer; border-left:8px solid var(--gold);
  }
  .queue-row:active{ transform: scale(0.98); }
  .queue-row .qnum{ font-size:28px; font-weight:800; min-width:52px; text-align:center; }
  .queue-row .qname{ flex:1; font-size:15px; font-weight:600; }
  .queue-row .qtime{ font-size:11px; color:#7A6E55; }
  .queue-row .qcheck{ font-size:22px; color:#8FA873; }

  /* FLASH schermo intero */
  .flash-screen{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    animation: flash-pulse 1s ease-in-out infinite;
  }
  @keyframes flash-pulse{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.08);} }
  .flash-caption{ color:rgba(255,255,255,0.9); font-size:20px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:6px; }
  .flash-number{ color:#fff; font-size:42vw; line-height:0.9; text-shadow:0 8px 30px rgba(0,0,0,0.35); }
  .flash-name{ color:#fff; font-size:28px; font-weight:700; margin-top:10px; text-align:center; padding:0 20px; }

  .empty-hint{ text-align:center; color:#5A5138; font-size:14px; margin-top:40px; line-height:1.6; }

  /* MODALE impostazioni */
  .modal-mini{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-mini .sheet{
    background:var(--cream); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px 18px 24px; max-height:88vh; overflow-y:auto;
  }
  .modal-mini h3{ margin:0 0 14px; font-size:19px; font-weight:800; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:#6B6248; margin-bottom:5px; font-weight:700; }
  .field input[type=text], .field input[type=number]{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px;
  }
  .field input[type=color]{ width:100%; height:46px; border:1px solid var(--line); border-radius:10px; padding:2px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 16px; border-radius:12px; border:none; font-weight:700; font-size:15px; cursor:pointer; }
  .btn-primary{ background:var(--green); color:#fff; }
  .btn-outline{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:none; color:var(--green); border:none; font-weight:700; font-size:13px; padding:6px 2px; cursor:pointer; }
  .sheet-actions{ display:flex; gap:10px; margin-top:14px; }
  .sheet-actions .btn{ flex:1; }
  .config-row{
    display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .config-row .csw{ width:26px; height:26px; border-radius:8px; flex:0 0 auto; }
  .config-row .cname{ flex:1; font-weight:600; }
  .config-row .cnum{ font-size:12px; color:#7A6E55; }
</style>
</head>
<body>
<div class="bg-poster"></div>
<div class="bg-overlay"></div>
<div id="app"></div>

<script>
(function(){
  "use strict";
  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const escapeHtml = (s) => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const SUPABASE_URL = 'https://kthkxlfrybtpslxqtugn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aGt4bGZyeWJ0cHNseHF0dWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MTI0OTMsImV4cCI6MjEwNDQ4ODQ5M30.PZTYiKp68FfgAeKsb7yL60FoJ7CX4afaifFo_A-biFQ';
  const hasStorage = !!window.supabase;
  const sb = hasStorage ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let connError = false;

  const KITCHEN_MODE = (function(){
    try{ return new URLSearchParams(location.search).get('cucina') === '1'; }
    catch(e){ return false; }
  })();

  function defaultItems(){
    return [
      {key:'contadino', name:'Tagliere del Contadino', color:'#B3242B'},
      {key:'classico',  name:'Tagliere Classico',       color:'#2F7A3D'},
      {key:'birra',     name:'Birra alla spina',        color:'#D9A227'},
    ];
  }

  let state = {
    items: [],
    tickets: [], // biglietti pending, caricati/sincronizzati dal db
  };
  let ui = {
    settingsOpen: false,
    modal: null,           // {type:'add-item'|'edit-item', key?}
    toast: null,           // {name, color, number}
    flashQueue: [],
    flashing: null,        // ticket in mostra a schermo intero
    lastAdded: null,       // ultimo biglietto arrivato (per il banner cucina)
  };
  const seenTicketIds = new Set();
  let flashInitialized = false;

  async function loadAll(){
    if(!hasStorage){ state.items = defaultItems(); render(); return; }
    try{
      const { data: cfg, error: e1 } = await sb.from('bierfest_config').select('*').eq('id','main').single();
      if(e1) throw e1;
      state.items = (cfg && cfg.items && cfg.items.length) ? cfg.items : defaultItems();
      if(!cfg || !cfg.items || !cfg.items.length){
        await sb.from('bierfest_config').update({ items: state.items }).eq('id','main');
      }
      const { data: tks, error: e2 } = await sb.from('bierfest_tickets').select('*').eq('status','pending').order('created_at', {ascending:true});
      if(e2) throw e2;
      state.tickets = tks || [];
      state.tickets.forEach(t=>seenTicketIds.add(t.id));
      flashInitialized = true; // non far lampeggiare quelli già in coda al primo carico
    }catch(e){
      console.error('load error', e);
      connError = true;
      state.items = defaultItems();
    }
    render();
    subscribeRealtime();
    startPolling();
  }

  async function persistConfig(){
    if(!hasStorage) return;
    try{
      const { error } = await sb.from('bierfest_config').update({ items: state.items, updated_at: new Date().toISOString() }).eq('id','main');
      if(error) throw error;
      connError = false;
    }catch(e){ console.error('save config error', e); connError = true; render(); }
  }

  function ingestTicket(t){
    if(seenTicketIds.has(t.id)) return;
    seenTicketIds.add(t.id);
    if(t.status==='pending'){
      state.tickets.push(t);
      state.tickets.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
    }
    ui.lastAdded = t;
    if(KITCHEN_MODE && flashInitialized){
      ui.flashQueue.push(t);
      processFlashQueue();
    }
  }
  function removeTicketLocally(id){
    state.tickets = state.tickets.filter(t=>t.id!==id);
  }

  function subscribeRealtime(){
    if(!hasStorage) return;
    try{
      sb.channel('bierfest_changes')
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'bierfest_tickets' }, (payload)=>{
          ingestTicket(payload.new);
          render();
        })
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'bierfest_tickets' }, (payload)=>{
          if(payload.new.status!=='pending'){ removeTicketLocally(payload.new.id); render(); }
        })
        .on('postgres_changes', { event:'DELETE', schema:'public', table:'bierfest_tickets' }, (payload)=>{
          removeTicketLocally(payload.old.id); render();
        })
        .subscribe();
    }catch(e){ console.error('realtime error', e); }
  }

  let polling = false;
  function startPolling(){
    if(polling || !hasStorage) return;
    polling = true;
    setInterval(async ()=>{
      try{
        const { data, error } = await sb.from('bierfest_tickets').select('*').eq('status','pending').order('created_at',{ascending:true});
        if(error) throw error;
        connError = false;
        const currentIds = new Set(state.tickets.map(t=>t.id));
        let changed = false;
        (data||[]).forEach(t=>{
          if(!seenTicketIds.has(t.id)){ ingestTicket(t); changed = true; }
        });
        const newIds = new Set((data||[]).map(t=>t.id));
        state.tickets.forEach(t=>{ if(!newIds.has(t.id)) changed = true; });
        state.tickets = state.tickets.filter(t=>newIds.has(t.id));
        if(changed) render();
      }catch(e){ connError = true; }
    }, 5000);
  }

  /* ---------- audio + vibrazione (cucina) ---------- */
  let audioCtx = null;
  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audioCtx.currentTime;
      [[784,t0],[988,t0+0.16],[1174,t0+0.32]].forEach(([freq,t])=>{
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type='sine'; o.frequency.value=freq;
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.32);
      });
    }catch(e){}
    if(navigator.vibrate) try{ navigator.vibrate([160,70,160]); }catch(e){}
  }

  function processFlashQueue(){
    if(ui.flashing || ui.flashQueue.length===0) return;
    ui.flashing = ui.flashQueue.shift();
    beep();
    render();
    setTimeout(()=>{
      ui.flashing = null;
      render();
      processFlashQueue();
    }, 5000);
  }

  /* ---------- render ---------- */
  function render(){
    const app = document.getElementById('app');
    if(KITCHEN_MODE && ui.flashing){
      app.innerHTML = flashScreen(ui.flashing);
      return;
    }
    app.innerHTML = KITCHEN_MODE ? kitchenView() : cassaView();
  }

  function syncPill(){
    return `<div class="sync-pill"><span class="sync-dot" style="background:${!hasStorage?'#C4BBA4':(connError?'#C0392B':'#7FA35C')}"></span>${!hasStorage?'Connessione non disponibile':(connError?'Connessione assente — riprovo…':'Sincronizzato')}</div>`;
  }

  function cassaView(){
    const grid = state.items.map(it => {
      const pending = state.tickets.filter(t=>t.item_key===it.key).length;
      return `
        <button class="item-btn" style="background:${it.color};" onclick="App.sendTicket('${it.key}')">
          ${pending>0 ? `<span class="pending-badge">${pending} in coda</span>` : ''}
          <span>${escapeHtml(it.name)}</span>
        </button>
      `;
    }).join('');

    return `
      <header>
        <div>
          <div class="name display-font">🍺 Idilia Bier Fest — Cassa</div>
          ${syncPill()}
        </div>
        <button class="icon-btn" onclick="App.openSettings()" title="Impostazioni">⚙️</button>
      </header>
      <main>
        <div class="panel">
          <div class="item-grid">
            ${grid}
            <button class="add-item-btn" onclick="App.openAddItem()">+</button>
          </div>
        </div>
      </main>
      ${ui.toast ? `
        <div class="toast"><span class="dot" style="background:${ui.toast.color};"></span> Biglietto #${ui.toast.number} — ${escapeHtml(ui.toast.name)} inviato</div>
      ` : ''}
      ${ui.settingsOpen ? settingsPanel() : ''}
      ${ui.modal ? modalMarkup() : ''}
    `;
  }

  function kitchenView(){
    const last = ui.lastAdded;
    const rows = state.tickets.map(t => `
      <div class="queue-row" style="border-left-color:${t.color};" onclick="App.completeTicket(${t.id})">
        <div class="qnum display-font" style="color:${t.color};">${t.ticket_number}</div>
        <div class="qname">${escapeHtml(t.item_name)}</div>
        <div class="qcheck">✓</div>
      </div>
    `).join('') || `<div class="empty-hint">Nessun ordine in attesa.<br>I nuovi ordini compariranno qui automaticamente.</div>`;

    return `
      <header>
        <div>
          <div class="name display-font">🍺 Idilia Bier Fest — Cucina</div>
          ${syncPill()}
        </div>
      </header>
      <main>
        ${last ? `
        <div class="now-banner">
          <span class="swatch" style="background:${last.color};"></span>
          <div class="num display-font">${last.ticket_number}</div>
          <div class="info">
            <div class="lbl">Ultimo arrivato</div>
            <div class="iname">${escapeHtml(last.item_name)}</div>
          </div>
        </div>
        ` : ''}
        <div class="queue-list">${rows}</div>
      </main>
    `;
  }

  function flashScreen(t){
    return `
      <div class="flash-screen" style="background:${t.color};">
        <div class="flash-caption">Nuovo ordine</div>
        <div class="flash-number display-font">${t.ticket_number}</div>
        <div class="flash-name">${escapeHtml(t.item_name)}</div>
      </div>
    `;
  }

  function settingsPanel(){
    const rows = state.items.map(it => `
      <div class="config-row" onclick="App.openEditItem('${it.key}')" style="cursor:pointer;">
        <span class="csw" style="background:${it.color};"></span>
        <span class="cname">${escapeHtml(it.name)}</span>
      </div>
    `).join('') || `<div class="empty-hint">Nessun elemento configurato.</div>`;

    return `
      <div class="modal-mini" onclick="if(event.target===this) App.closeSettings()">
        <div class="sheet">
          <h3>Impostazioni</h3>
          <div class="field"><label>Elementi in vendita</label>${rows}</div>
          <button class="btn btn-outline btn-block" onclick="App.openAddItem()">+ Nuovo elemento</button>
          <button class="btn btn-danger btn-block" style="margin-top:20px;" onclick="App.resetAll()">Azzera biglietti e contatori</button>
          <div class="empty-hint" style="margin-top:6px;">Da usare prima dell'inizio dell'evento, per ripartire da 1.</div>
          <button class="btn-ghost" style="width:100%; margin-top:10px;" onclick="App.closeSettings()">Chiudi</button>
        </div>
      </div>
    `;
  }

  function modalMarkup(){
    const m = ui.modal;
    if(!m) return '';
    const editing = m.type==='edit-item';
    const it = editing ? state.items.find(x=>x.key===m.key) : {name:'', color:'#B3242B'};
    return `
      <div class="modal-mini" onclick="if(event.target===this) App.closeModal()">
        <div class="sheet">
          <h3>${editing ? 'Modifica elemento' : 'Nuovo elemento'}</h3>
          <div class="field"><label>Nome</label><input id="m-name" type="text" value="${escapeHtml(it.name)}" placeholder="Es. Tagliere del Contadino"></div>
          <div class="field"><label>Colore</label><input id="m-color" type="color" value="${it.color}"></div>
          <div class="sheet-actions">
            ${editing ? `<button class="btn btn-danger" onclick="App.deleteItem('${it.key}')">Elimina</button>` : ''}
            <button class="btn btn-primary" onclick="App.saveItem(${editing ? `'${it.key}'` : 'null'})">Salva</button>
          </div>
          <button class="btn-ghost" style="width:100%; margin-top:4px;" onclick="App.closeModal()">Annulla</button>
        </div>
      </div>
    `;
  }

  /* ---------- azioni ---------- */
  const App = {
    async sendTicket(key){
      const it = state.items.find(x=>x.key===key); if(!it) return;
      try{
        const { data: num, error: e1 } = await sb.rpc('bierfest_next_number', { p_item_key: key });
        if(e1) throw e1;
        const row = { item_key: key, item_name: it.name, color: it.color, ticket_number: num, status: 'pending' };
        const { data: inserted, error: e2 } = await sb.from('bierfest_tickets').insert(row).select().single();
        if(e2) throw e2;
        seenTicketIds.add(inserted.id);
        state.tickets.push(inserted);
        connError = false;
        ui.toast = { name: it.name, color: it.color, number: num };
        render();
        setTimeout(()=>{ ui.toast = null; render(); }, 1800);
      }catch(e){
        console.error('sendTicket error', e);
        connError = true;
        alert('Non sono riuscito a inviare il biglietto. Controlla la connessione.');
        render();
      }
    },
    completeTicket(id){
      removeTicketLocally(id);
      render();
      sb.from('bierfest_tickets').update({ status:'done', done_at: new Date().toISOString() }).eq('id', id)
        .then(({error})=>{ if(error){ console.error(error); connError = true; render(); } });
    },

    openSettings(){ ui.settingsOpen = true; render(); },
    closeSettings(){ ui.settingsOpen = false; render(); },
    openAddItem(){ ui.modal = {type:'add-item'}; render(); },
    openEditItem(key){ ui.modal = {type:'edit-item', key}; render(); },
    closeModal(){ ui.modal = null; render(); },
    saveItem(key){
      const name = document.getElementById('m-name').value.trim();
      const color = document.getElementById('m-color').value;
      if(!name) return;
      if(key){
        const it = state.items.find(x=>x.key===key);
        it.name = name; it.color = color;
      } else {
        let base = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
        let k = base, n = 1;
        while(state.items.find(x=>x.key===k)){ k = base + '-' + (++n); }
        state.items.push({ key:k, name, color });
      }
      persistConfig(); ui.modal = null; render();
    },
    deleteItem(key){
      if(!confirm('Eliminare questo elemento dalla cassa?')) return;
      state.items = state.items.filter(x=>x.key!==key);
      persistConfig(); ui.modal = null; render();
    },
    resetAll(){
      if(!confirm('Azzerare TUTTI i biglietti in coda e riportare i contatori a 0? Non si può annullare.')) return;
      (async()=>{
        try{
          await sb.from('bierfest_tickets').delete().not('id','is',null);
          await sb.from('bierfest_counters').delete().not('item_key','is',null);
          state.tickets = [];
          seenTicketIds.clear();
          ui.settingsOpen = false;
          render();
        }catch(e){ alert('Errore nel reset: ' + e.message); }
      })();
    },
  };
  window.App = App;

  loadAll();
})();
</script>
</body>
</html>
